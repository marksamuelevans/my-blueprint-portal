# My Blueprint — patient portal (sandbox).
#
# This build carries no backend and no PHI: every screen reads from
# src/data/fixtures.ts through src/data/api.ts. The site is password-gated
# and noindexed anyway, because a patient portal on an open URL gets
# screenshotted out of context even when the data is invented.

# Deploys are manual (`netlify deploy --prod --dir=dist`) — there is no repo
# connected yet, so this block only matters if one is linked later.
[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The app is a hash router, so this only catches stray deep links.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag            = "noindex, nofollow, noarchive, nosnippet"
    X-Frame-Options         = "DENY"
    X-Content-Type-Options  = "nosniff"
    Referrer-Policy         = "no-referrer"
    Permissions-Policy      = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
